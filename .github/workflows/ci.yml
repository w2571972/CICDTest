# CI/CD 管線，分成兩段：
#   CI（持續整合）：每次推送或發 PR，都在乾淨的機器上檢查程式風格、跑測試
#   CD（持續部署）：檢查全部通過後組裝網站；如果是 main，就自動部署到 GitHub Pages
# 任何一站失敗，後面的站都不會執行。
#
#   lint ─┐
#         ├→ ci-passed → build-site → deploy（只有 main）
#   test ─┘

name: CI/CD

# 最小權限原則：預設只能「讀」儲存庫。需要更多權限的 job 再自己申請
permissions:
  contents: read

# 什麼時候執行
on:
  push:
    branches: [main] # 推到 main 時
  pull_request: # 任何 PR 建立或更新時（不論來源分支）
  workflow_dispatch: # 允許在 Actions 頁面手動按按鈕執行

jobs:
  # 程式風格只要檢查一次，跟 Python 版本和作業系統無關，所以獨立成一個 job
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          # 這兩個檔案有變動時，快取就會重新建立
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      # 開發工具從 requirements-dev.txt 安裝，每次都是同一個鎖定的版本
      - name: 安裝套件
        run: pip install -r requirements-dev.txt -e .
      # ruff check 找問題，ruff format --check 確認排版一致
      - name: 檢查程式風格
        run: |
          ruff check .
          ruff format --check .

  # 矩陣測試：下面的 os 和 python-version 會交叉組合，
  # 2 種作業系統 × 3 個 Python 版本 = 同時開 6 台機器各跑一次
  test:
    strategy:
      # 預設只要一個組合失敗，其他還在跑的會被取消。
      # 關掉它才能一次看到「哪些組合壞了、哪些沒壞」
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: 安裝套件
        run: pip install -r requirements-dev.txt -e .
      # --cov 會同時計算覆蓋率，低於 pyproject.toml 設定的門檻時這一步會失敗
      - name: 執行測試並計算覆蓋率
        run: pytest -v --cov

      # 把覆蓋率表格顯示在這次執行的摘要頁。只需要一份，所以只在其中一個組合執行。
      # always() 讓覆蓋率不足時也會產生報告，方便看是哪幾行沒測到
      - name: 覆蓋率報告寫入執行摘要
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

  # 彙總 job：分支保護只要求這一個檢查。
  # 以後矩陣增加或減少組合，都不用回頭改分支保護的設定。
  ci-passed:
    needs: [lint, test] # 等 lint 和所有 test 組合都結束才執行
    # 一定要有 if: always()。否則前面失敗時這個 job 會被「略過」，
    # 而 GitHub 把略過的必要檢查當成通過，PR 就會被放行
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 確認所有檢查都通過
        run: |
          echo "lint 結果：${{ needs.lint.result }}"
          echo "test 結果：${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]

  # ─────────────────────────── 以下是 CD ───────────────────────────

  # 組裝網站。PR 也會執行，提早確認網站「組得起來」，但 PR 不會部署
  build-site:
    needs: ci-passed # 所有檢查都通過才開始
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 組裝網站
        run: python scripts/build_site.py
      # 每個 job 都在不同的機器上執行，檔案不會自動共用。
      # 所以要把 _site 打包成 artifact 上傳，下一個 job 才拿得到
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # 部署到 GitHub Pages
  deploy:
    needs: build-site
    # 只有 main 才部署。PR 執行時 github.ref 是 refs/pull/編號/merge，這個 job 會顯示「略過」
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 只有這個 job 申請額外權限，其他 job 就算被動手腳也碰不到部署
    permissions:
      pages: write # 寫入 GitHub Pages
      id-token: write # 向 GitHub 證明「我是這個儲存庫在跑的 workflow」
    # environment：部署目標。GitHub 會記錄每一次部署，可以設定只允許 main 部署
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 連續合併兩個 PR 時，兩次部署排隊依序進行，不會同時寫入網站
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
