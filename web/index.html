<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 × CI/CD</title>
<style>
  :root {
    --bg: #faf8ef; --ink: #776e65; --muted: #8f857b;
    --board: #bbada0; --cell: #cdc1b4; --button: #8f7a66;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1d1a; --ink: #e8e2d9; --muted: #a39a8f;
      --board: #3a3530; --cell: #4a443d; --button: #6b5b4d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  header, #board { width: min(100%, 420px); }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 44px; }
  .score {
    min-width: 88px; padding: 6px 14px; border-radius: 6px;
    background: var(--board); color: #fff; text-align: center; font-weight: 700; font-size: 22px;
  }
  .score small { display: block; font-size: 12px; opacity: .85; }
  #board {
    aspect-ratio: 1; padding: 10px; border-radius: 8px; background: var(--board);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    touch-action: none; user-select: none;
  }
  .cell {
    display: grid; place-items: center; border-radius: 5px;
    background: var(--cell); color: #776e65; font-weight: 800; font-size: clamp(18px, 7vw, 34px);
  }
  .t2 { background: #eee4da; } .t4 { background: #ede0c8; }
  .t8, .t16, .t32, .t64, .t128, .t256, .t512, .t1024, .t2048, .tbig { color: #f9f6f2; }
  .t8 { background: #f2b179; } .t16 { background: #f59563; } .t32 { background: #f67c5f; }
  .t64 { background: #f65e3b; } .t128 { background: #edcf72; } .t256 { background: #edcc61; }
  .t512 { background: #edc850; }
  .t1024, .t2048, .tbig { font-size: clamp(14px, 5.5vw, 28px); }
  .t1024 { background: #edc53f; } .t2048 { background: #edc22e; } .tbig { background: #3c3a32; }
  #message { min-height: 1.5em; margin: 0; font-weight: 600; text-align: center; }
  button {
    font: inherit; font-weight: 700; padding: 8px 18px; border: 0; border-radius: 6px;
    background: var(--button); color: #f9f6f2; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  footer { color: var(--muted); font-size: 13px; line-height: 1.7; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>2048</h1>
  <div class="score"><small>分數</small><span id="score">0</span></div>
</header>
<div id="board" aria-label="遊戲盤面"></div>
<p id="message">正在載入 Python，第一次大約需要幾秒鐘…</p>
<button id="new-game" disabled>新遊戲</button>
<footer>
  方向鍵或 WASD 移動，手機可以直接滑動<br>
  遊戲規則由 Python（board.py）在瀏覽器中執行<br>
  部署版本 <a href="https://github.com/w2571972/CICDTest/commit/__VERSION__">__VERSION__</a>
</footer>

<!-- Pyodide：編譯成 WebAssembly 的 Python，讓瀏覽器可以執行 .py 檔 -->
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
<script type="module">
  const KEYS = {
    ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
    a: "left", d: "right", w: "up", s: "down",
  };
  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const messageEl = document.getElementById("message");
  const newGameBtn = document.getElementById("new-game");
  const cells = Array.from({ length: 16 }, () =>
    boardEl.appendChild(Object.assign(document.createElement("div"), { className: "cell" })),
  );

  let rules; // Python 的 board 模組
  let game;  // Python 的 Game 物件

  function newGame() {
    game?.destroy();
    game = rules.Game();
    render();
  }

  function render() {
    const proxy = game.board; // Python 的 list，轉成 JavaScript 陣列後釋放
    const values = proxy.toJs().flat();
    proxy.destroy();
    values.forEach((v, i) => {
      cells[i].textContent = v || "";
      cells[i].className = "cell" + (v ? (v > 2048 ? " tbig" : ` t${v}`) : "");
    });
    scoreEl.textContent = game.score;
    messageEl.textContent = game.over
      ? "遊戲結束！按「新遊戲」再來一局"
      : game.won ? "恭喜拼出 2048！可以繼續玩" : "";
  }

  function play(direction) {
    if (game && !game.over && game.play(direction)) render();
  }

  document.addEventListener("keydown", (e) => {
    const direction = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
    if (!direction) return;
    e.preventDefault();
    play(direction);
  });

  let start = null;
  boardEl.addEventListener("pointerdown", (e) => { start = { x: e.clientX, y: e.clientY }; });
  boardEl.addEventListener("pointerup", (e) => {
    if (!start) return;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
    play(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });

  newGameBtn.addEventListener("click", newGame);

  try {
    const pyodide = await loadPyodide();
    const res = await fetch("board.py");
    if (!res.ok) throw new Error(`board.py 載入失敗（HTTP ${res.status}）`);
    pyodide.FS.writeFile("board.py", await res.text());
    rules = pyodide.pyimport("board");
    newGame();
    newGameBtn.disabled = false;
  } catch (err) {
    messageEl.textContent = `載入失敗：${err.message}`;
    throw err;
  }
</script>
</body>
</html>
