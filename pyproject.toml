[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "game2048"
version = "0.2.0"
description = "2048 小遊戲（終端機版與網頁版），用來練習 CI/CD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# 開發時才需要的工具：pip install -e ".[dev]"
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
game2048 = "game2048.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

# 覆蓋率設定：執行 pytest --cov 時使用
[tool.coverage.run]
source = ["game2048"]
branch = true # 除了每一行，也檢查 if 的「成立」和「不成立」兩條路是否都有走過
omit = ["*/__main__.py"] # 只是呼叫 main() 的入口，沒有邏輯

[tool.coverage.report]
show_missing = true # 列出沒被測到的行號
fail_under = 95 # 低於 95% 就算失敗，CI 會變紅

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# E/F：基本錯誤　I：import 排序　B：常見 bug　UP：改用較新的語法
select = ["E", "F", "I", "B", "UP"]
